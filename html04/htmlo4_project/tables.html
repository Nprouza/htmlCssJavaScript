<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {border: 4px solid #1d07e9; border-collapse: collapse; }
        th, td {padding: 6px}
        th {
            background-color: rgb(204, 0, 255); }
    </style>

</head>
<body>
<h1>Lunch Menu</h1>
<table>
    <caption>Weekly lunch menu</caption>
    <tr>
        <th>Day</th>
        <th>Main</th>
        <th>Side</th>
    </tr>
    <tr>
        <td>Monday</td>
        <td>Pizza</td>
        <td>Salad</td>
    </tr>
    <tr>
        <td>Tuesday</td>
        <td>Tacos</td>
        <td>Rice</td>
    </tr>
    <tr>
        <td>Wendsday</td>
        <td>Chicken Sandwich</td>
        <td>French Fries</td>
    </tr>
    <tr>
        <td>Thursday</td>
        <td>Load Fries</td>
        <td>Salad</td>
    </tr>
    <tr>
        <td>Friday</td>
        <td colspan="2">No School - Holiday</td>
    </tr>
</table>
</body>
</html>
