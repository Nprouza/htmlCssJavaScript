<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Nick Prouza for design, web development, and portfolio opportunities.">
  <title>Contact | Nick Prouza</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <div class="brand-mark">NP</div>
      <div>
        <p class="brand-name">Nick Prouza</p>
        <p class="tagline">Creative designer & developer</p>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="page-shell narrow-page">
    <section class="card contact-intro">
      <p class="eyebrow">Contact</p>
      <h1>Let’s build something meaningful.</h1>
      <p>Whether you need a portfolio refresh, a landing page, or a clearer online presence, I’d love to hear about your goals.</p>
      <p><strong>Email:</strong> <a href="mailto:nickprouza@gmail.com">nickprouza@gmail.com</a></p>
    </section>

    <section class="card form-card">
      <form class="contact-form" action="#" method="post">
        <div class="field-row">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required>
        </div>

        <div class="field-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required>
        </div>

        <div class="field-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="button primary">Submit</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Nick Prouza</p>
  </footer>
</body>
</html>
